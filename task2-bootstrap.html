<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Task 2. Bootstrap form styling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Forms and Validation</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="task0-contact.html">Task 0</a></li>
                    <li class="nav-item"><a class="nav-link" href="task1-validation.html">Task 1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="task2-bootstrap.html">Task 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="task3-bootstrap-validation.html">Task 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="task4-registration.html">Task 4</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1>Task 2. Bootstrap form styling</h1>

        <form class="row g-3" action="#" method="post">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Kamila Ahmadzada">
                <div class="form-text">Enter your first and last name.</div>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                <div class="form-text">We will only use it to reply to you.</div>
            </div>
            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Send message</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
